; ============================================================
;  Configuració de l'actualitzador del catàleg de Cal Gendre
;  (aquest fitxer només l'ha de tocar l'Alba, un cop)
;  Copia'l amb el nom config.ini i omple la secció [github]
; ============================================================

[opcions]
; Carpeta on es desen les exportacions de Galatea.
; El programa agafa sempre el fitxer .xlsx/.xls/.csv MÉS RECENT d'aquesta carpeta.
carpeta_exportacions = %USERPROFILE%\Documents\Exportacions Galatea

; true = només es publiquen els llibres amb existències disponibles > 0
nomes_amb_estoc = true

; true = només es publiquen els articles que tenen marcat "Publicar web" a Galatea
nomes_marcats_publicar_web = false

; Famílies de Galatea que NO són llibres i no han de sortir a la web (separades per |)
excloure_families = Cafeteria

; Llibres amb data d'edició de fa menys d'aquests dies -> "Novetat" (0 = no fer-ho servir)
dies_novetat = 120

; "Vila, Enric" -> "Enric Vila"
girar_autor = true

; Si l'article no té imatge a Galatea, intenta posar la portada a partir de l'ISBN (Open Library)
portades_per_isbn = true

[github]
; Repositori de la web, en format usuari/nom
repositori = USUARI/calgendre-web
branca = main
; Token "fine-grained" amb permís Contents: Read and write NOMÉS sobre aquest repositori
token = POSA_AQUI_EL_TOKEN
ruta_csv = cataleg.csv
ruta_info = cataleg-info.json

[columnes]
; Noms de columna de l'Excel per a cada camp, per ordre de preferència, separats per |
; (es fa servir el primer que existeixi). No importen majúscules ni accents.
; Ja estan ajustats a l'exportació d'articles de Galatea.
titol        = DESCRIPCIÓ ARTICLE | Títol | Titulo | Descripció | Descripción
autor        = AUTOR | AUTORS | Autores
editorial    = NOM EDITORIAL | Editorial
seccio       = NOM TEMA | NOMTEMAGENERAL | Matèria | Materia | Secció
preu         = P.V.P IVA | PVP IVA | PVP con IVA | PVP | PrecioIvaConAsociados | Preu
estoc        = DISPONIBLES | EXISTÈNCIES | ExistenciasTotal | Stock | Existencias
isbn         = CODI | ISBN | EAN | REFERÈNCIA
familia      = NOM FAMÍLIA | Família | Familia
publicar_web = PUBLICAR WEB
portada      = IMATGE
novetat      = Novetat | Novedad
data_novetat = DATAEDICIÓ | Data edició | Fecha edición
